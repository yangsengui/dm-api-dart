name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (example: 0.1.0-beta.1)"
        required: false
        default: "0.1.0-beta.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PUB_DEV_TOKEN: ${{ secrets.PUB_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ -z "${version}" ]]; then
            echo "Version input is required." >&2
            exit 1
          fi

          echo "package_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=v${version}" >> "${GITHUB_OUTPUT}"
      - uses: dart-lang/setup-dart@v1
      - name: Set package version in pubspec.yaml
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.package_version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pubspec.yaml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version\s*:\s*.*$',
              f'version: {os.environ["PACKAGE_VERSION"]}',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Failed to update version in pubspec.yaml")
          path.write_text(updated, encoding="utf-8")
          PY
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart pub publish --dry-run
      - name: Build source package
        shell: bash
        run: |
          rm -rf dist-release
          mkdir -p dist-release
          git archive --format=tar.gz --output "dist-release/dm-api-dart-${{ steps.meta.outputs.package_version }}.tar.gz" HEAD
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dart-package-${{ steps.meta.outputs.package_version }}
          path: dist-release/*
      - name: Publish package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          prerelease: ${{ contains(steps.meta.outputs.package_version, '-') }}
          generate_release_notes: true
          files: dist-release/*
      - name: Publish to pub.dev
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && env.PUB_DEV_TOKEN != ''
        shell: bash
        env:
          PUB_DEV_TOKEN: ${{ env.PUB_DEV_TOKEN }}
        run: |
          dart pub token add https://pub.dev --env-var PUB_DEV_TOKEN
          dart pub publish -f
